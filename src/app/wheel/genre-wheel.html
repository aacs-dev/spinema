<button
  #button
  type="button"
  class="wheel"
  [class.is-spinning]="spinning()"
  [class.is-lit]="litPath() !== null"
  [attr.aria-disabled]="disabled() || spinning() ? 'true' : null"
  [attr.aria-describedby]="describedBy()"
  (click)="activate()"
>
  <span class="floor-shadow" aria-hidden="true"></span>

  <svg class="marquee" viewBox="0 0 400 400" aria-hidden="true" focusable="false">
    <circle class="ring-frame" cx="200" cy="200" r="199" />
    <circle class="ring-rim" cx="200" cy="200" r="197" stroke-width="2" />
    <circle class="ring-bevel" cx="200" cy="200" r="194" />
    @for (bulb of bulbs; track $index) {
      <g [attr.transform]="'translate(' + bulb.x + ' ' + bulb.y + ')'">
        <circle class="socket" r="7.6" />
        <circle class="bulb-off" r="5.2" />
      </g>
    }
    <circle class="ring-rim" cx="200" cy="200" r="171" stroke-width="4" />
    <circle class="ring-edge" cx="200" cy="200" r="167.5" />
  </svg>

  <!--
    The lit bulbs live on three separate layers, one per chase group. Only their opacity animates,
    which the compositor handles without repainting the wheel on every frame.
  -->
  @for (group of bulbGroups; track $index) {
    <svg [attr.class]="'lights p' + $index" viewBox="0 0 400 400" aria-hidden="true" focusable="false">
      @for (bulb of group; track $index) {
        <g [attr.transform]="'translate(' + bulb.x + ' ' + bulb.y + ')'">
          <circle class="halo" r="10.5" />
          <circle class="bulb-on" r="5.2" />
          <circle class="glint" cx="-1.7" cy="-1.7" r="1.6" />
        </g>
      }
    </svg>
  }

  <span
    #rotor
    class="rotor"
    [style.transform]="'rotate(' + (enteringAt() ?? rotation()) + 'deg)'"
    [style.transition-duration.ms]="durationMs()"
  >
    <svg viewBox="-170 -170 340 340" aria-hidden="true" focusable="false">
      @for (segment of segments(); track segment.key) {
        <path [attr.d]="segment.path" [attr.class]="'seg seg-' + segment.color" />
      }
      @if (litPath(); as path) {
        <path class="seg-lit" [attr.d]="path" />
      }
      <circle class="inner-ring" r="64" />
      @for (segment of segments(); track segment.key) {
        <text
          [attr.class]="'seg-label label-' + segment.color"
          [attr.transform]="segment.labelTransform"
          [attr.x]="labelEnd"
          y="0"
          text-anchor="end"
          dominant-baseline="central"
          [attr.font-size]="segment.fontSize"
        >{{ segment.name }}</text>
      }
      @for (rivet of rivets(); track $index) {
        <circle class="rivet" [attr.cx]="rivet.x" [attr.cy]="rivet.y" r="2.6" />
      }
    </svg>
  </span>

  <span class="rotor-shade" aria-hidden="true"></span>

  <!-- The accessible name starts with the visible word, so voice control can say "Învârte". -->
  <span class="hub">
    <span class="hub-label">{{ t.wheel.spin }}</span><span class="sr-only"> {{ t.wheel.labelSuffix }}</span>
  </span>

  <svg class="pointer" viewBox="0 0 40 52" aria-hidden="true" focusable="false">
    <path class="ptr-body" d="M5 5 H35 L20 47 Z" />
    <path class="ptr-shade" d="M20 5 H35 L20 47 Z" />
    <circle class="ptr-halo" cx="20" cy="16" r="8" />
    <circle class="ptr-bulb" cx="20" cy="16" r="4.6" />
  </svg>
</button>
